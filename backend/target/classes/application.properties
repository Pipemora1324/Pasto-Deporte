# =============================================
# PASTO DEPORTE - Configuracion de la aplicacion
# =============================================

# Servidor
server.port=9797

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pasto_deporte
spring.datasource.username=postgres
spring.datasource.password=Pipemora
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT - Seguridad
jwt.secret=5A7134743777217A25432A462D4A614E645267556B58703272357538782F413F44
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Archivos - Almacenamiento local
archivos.upload-dir=uploads
spring.web.resources.static-locations=file:uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WhatsApp Alertas (CallMeBot)
alerta.whatsapp.phone=
alerta.whatsapp.apikey=
alerta.whatsapp.enabled=false

# Nombre de la aplicacion
spring.application.name=pasto-deporte-sistema

# Logging
logging.level.com.pastodeporte=DEBUG
logging.level.org.springframework.security=INFO

# Perfil activo por defecto
spring.profiles.active=dev
