# =============================================
# PASTO DEPORTE - Configuracion de PRODUCCION
# Activo con: --spring.profiles.active=prod
# =============================================

# Servidor (Render usa $PORT)
server.port=${PORT:9797}

# Base de datos (variables de entorno obligatorias en Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT - Seguridad (variable de entorno obligatoria en Render)
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Archivos - Almacenamiento en /tmp (unico directorio escribible en Render)
archivos.upload-dir=/tmp/uploads
spring.web.resources.static-locations=file:/tmp/uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WhatsApp Alertas (CallMeBot - opcionales)
alerta.whatsapp.phone=${WHATSAPP_PHONE:}
alerta.whatsapp.apikey=${WHATSAPP_APIKEY:}
alerta.whatsapp.enabled=false

# Logging reducido en produccion
logging.level.com.pastodeporte=INFO
logging.level.org.springframework.security=WARN
